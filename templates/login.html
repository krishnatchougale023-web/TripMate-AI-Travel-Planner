<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TripMate</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(2, 132, 199, 0.3), rgba(2, 132, 199, 0.3)),
                url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80')
                no-repeat center center/cover;

            overflow: hidden;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);

            padding: 40px;
            border-radius: 20px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);

            width: 100%;
            max-width: 420px;

            text-align: center;

            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #0284c7;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;
            margin-bottom: 10px;

            cursor: pointer;
            text-decoration: none;
        }

        .login-container h2 {
            font-size: 22px;
            color: #333;

            margin-bottom: 25px;

            font-weight: 600;
        }

        /* Error Message */

        .error-message {
            color: #dc2626;

            background: #fef2f2;

            border: 1px solid #fecaca;

            padding: 10px 12px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 18px;

            text-align: center;
        }

        .input-group {
            position: relative;

            margin-bottom: 20px;

            text-align: left;
        }

        .input-group i {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #64748b;

            font-size: 16px;
        }

        .input-group input {
            width: 100%;

            padding: 14px 15px 14px 45px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: all 0.3s ease;

            background: rgba(255, 255, 255, 0.9);
        }

        .input-group input:focus {
            border-color: #0284c7;

            box-shadow:
                0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .extra-options {
            display: flex;

            justify-content: space-between;
            align-items: center;

            font-size: 14px;

            margin-bottom: 25px;
        }

        .remember-me {
            display: flex;

            align-items: center;

            gap: 6px;

            color: #4b5563;

            cursor: pointer;
        }

        .forgot-pass {
            color: #0284c7;

            text-decoration: none;

            font-weight: 500;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;

            padding: 14px;

            background-color: #0284c7;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.3s ease,
                transform 0.2s ease;

            box-shadow:
                0 4px 6px rgba(2, 132, 199, 0.2);
        }

        .btn-login:hover {
            background-color: #0369a1;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .signup-text {
            margin-top: 25px;

            font-size: 14px;

            color: #4b5563;
        }

        .signup-text a {
            color: #0284c7;

            text-decoration: none;

            font-weight: 600;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 480px) {

            .login-container {
                padding: 30px 20px;

                width: 90%;
            }

            .logo {
                font-size: 25px;
            }

            .login-container h2 {
                font-size: 20px;
            }

            .extra-options {
                font-size: 12px;
            }
        }

    </style>

</head>


<body>

    <div class="login-container">

        <!-- TripMate Logo -->

        <a href="/trip" class="logo">

            <i class="fa-solid fa-umbrella-beach"></i>

            TripMate

        </a>


        <h2>Welcome Back!</h2>


        <!-- Error Message -->

        {% if error %}

        <div class="error-message">

            <i class="fa-solid fa-circle-exclamation"></i>

            {{ error }}

        </div>

        {% endif %}


        <!-- Login Form -->

        <form action="/login" method="POST">


            <!-- Email -->

            <div class="input-group">

                <i class="fa-regular fa-envelope"></i>

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

            </div>


            <!-- Password -->

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

            </div>


            <!-- Remember Me & Forgot Password -->

            <div class="extra-options">

                <label class="remember-me">

                    <input type="checkbox">

                    Remember me

                </label>


                <a href="#" class="forgot-pass">

                    Forgot Password?

                </a>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="btn-login">

                Login

            </button>

        </form>


        <!-- Sign Up -->

        <div class="signup-text">

            Don't have an account?

            <a href="/signup">
                Sign Up
            </a>

        </div>

    </div>

</body>

</html>
